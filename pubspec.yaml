name: who_is_this_kansen
description: "Who Is This Kansen — a Pokedex-style guessing game for Azur Lane kansens."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.15.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/kansen/
    - assets/kansen/portraits/
    - assets/kansen/thumbnails/
    - assets/kansen/skill_icons/
